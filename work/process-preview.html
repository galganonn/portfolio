<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process — Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Crimson+Pro:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #fff; font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 60px 40px; }

#process-fit { position: relative; width: 100%; max-width: 1160px; }
.p-stage { width: 1160px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; transform-origin: top center; }
.p-row { display: flex; align-items: center; }

.p-card {
  width: 260px; border-radius: 16px; background: #F9FAFB;
  border: 1px solid #E5E7EB;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05), 0 8px 24px rgba(0,0,0,0.05);
  overflow: hidden; display: flex; flex-direction: column; opacity: 0;
}
.p-card-body {
  padding: 20px 20px 20px;
  display: flex; align-items: center; gap: 16px; flex: 1;
}
.p-num { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); opacity: 0.8; }
.p-label { font-weight: 600; font-size: 15px; color: #323338; line-height: 1.2; margin-top: 3px; }
.p-icon {
  width: 48px; height: 48px; border-radius: 12px;
  background: var(--accent-bg); color: var(--accent);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

.p-arrow { position: relative; width: 40px; height: 20px; flex-shrink: 0; transform-origin: left center; opacity: 0; }
.p-arrow-line { position: absolute; top: 50%; left: 0; width: calc(100% - 8px); height: 1.5px; background: var(--accent); opacity: var(--line-op); transform: translateY(-50%); }
.p-arrow-head { position: absolute; right: 0; top: 50%; transform: translateY(-50%); color: var(--accent); opacity: var(--head-op); }
.p-arrow-dot { position: absolute; top: 50%; left: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px 2px var(--accent-glow); transform: translateY(-50%); opacity: 0; }

.p-loop { align-self: flex-end; width: 560px; margin-top: -2px; position: relative; height: 68px; }
.p-loop svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.p-arc { stroke-dasharray: 5 4; opacity: 0; }
.p-arc-head { opacity: 0; }
.p-arc-dot { position: absolute; top: 0; left: 0; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #D4508A; box-shadow: 0 0 8px 3px rgba(212,80,138,0.4); opacity: 0; }
.p-caption { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; color: #D4508A; opacity: 0; white-space: nowrap; letter-spacing: 0.04em; }

.p-stage.is-visible .p-card { animation: p-card-in 0.5s cubic-bezier(0.34,1.2,0.64,1) both; animation-delay: calc(var(--i) * 0.12s); }
.p-stage.is-visible .p-arrow { animation: p-arrow-in 0.25s ease-out both; animation-delay: calc(0.1s + var(--i) * 0.12s); }
.p-stage.is-visible .p-arrow-dot { animation: p-dot-travel 3.5s ease-in-out infinite both; animation-delay: calc(0.65s + var(--i) * 0.28s); }
.p-stage.is-visible .p-arc { animation: p-fade-in 0.9s ease-out 0.9s both, p-march 1.6s linear 0.9s infinite; }
.p-stage.is-visible .p-arc-head { animation: p-fade-in 0.4s ease-out 1.75s both; }
.p-stage.is-visible .p-caption { animation: p-caption-in 0.5s ease-out 1.9s both; }
.p-stage.is-visible .p-arc-dot { animation: p-arc-travel 2.7s ease-in-out 1.1s infinite both; }

@keyframes p-card-in { from { opacity: 0; transform: translateY(14px) scale(0.95); } to { opacity: 1; transform: none; } }
@keyframes p-arrow-in { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
@keyframes p-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes p-caption-in { from { opacity: 0; } to { opacity: 0.6; } }
@keyframes p-march { to { stroke-dashoffset: -9; } }
@keyframes p-dot-travel {
  0% { left: 0; opacity: 0; }
  2.6% { opacity: 1; }
  22.6% { opacity: 1; }
  25.7% { left: 84%; opacity: 0; }
  100% { left: 84%; opacity: 0; }
}
@keyframes p-arc-travel {
  0%    { left: 94.12%; top: 10%;    opacity: 0; }
  3.9%  { opacity: 1; }
  6.9%  { left: 90.32%; top: 34.07%; }
  13.9% { left: 80.33%; top: 51.23%; }
  20.8% { left: 66.19%; top: 61.55%; }
  27.8% { left: 50%;    top: 65%; }
  34.7% { left: 33.81%; top: 61.55%; }
  41.7% { left: 19.67%; top: 51.23%; }
  48.6% { left: 9.68%;  top: 34.07%; }
  51%   { opacity: 1; }
  55.5% { left: 5.88%;  top: 10%;    opacity: 0; }
  100%  { left: 5.88%;  top: 10%;    opacity: 0; }
}
</style>
</head>
<body>

<div id="process-fit">
  <div class="p-stage is-visible" id="process-stage">
    <div class="p-row">

      <!-- 01 Research -->
      <div class="p-card" style="--accent: #4169E1; --accent-bg: #EEF2FF; --i: 0;">
        <div class="p-card-body">
          <div class="p-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="m8 11 2 2 4-4"></path><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
            </svg>
          </div>
          <div>
            <div class="p-num">01</div>
            <div class="p-label">Research</div>
          </div>
        </div>
      </div>

      <div class="p-arrow" style="--accent: #94A3B8; --accent-glow: rgba(148,163,184,0.4); --line-op: 0.4; --head-op: 0.5; --i: 0;">
        <div class="p-arrow-line"></div>
        <svg class="p-arrow-head" width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 1.5L7.5 4.5L1 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div class="p-arrow-dot"></div>
      </div>

      <!-- 02 Concepts -->
      <div class="p-card" style="--accent: #7C6FD4; --accent-bg: #F2F0FB; --i: 1;">
        <div class="p-card-body">
          <div class="p-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.174 6.813a2.82 2.82 0 0 0-3.986-3.987L3.842 16.175a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path>
              <path d="m15.007 5.008 3.987 3.986"></path>
            </svg>
          </div>
          <div>
            <div class="p-num">02</div>
            <div class="p-label">Concepts</div>
          </div>
        </div>
      </div>

      <div class="p-arrow" style="--accent: #94A3B8; --accent-glow: rgba(148,163,184,0.4); --line-op: 0.4; --head-op: 0.5; --i: 1;">
        <div class="p-arrow-line"></div>
        <svg class="p-arrow-head" width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 1.5L7.5 4.5L1 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div class="p-arrow-dot"></div>
      </div>

      <!-- 03 User Testing -->
      <div class="p-card" style="--accent: #9B6FD4; --accent-bg: #F5F0FB; --i: 2;">
        <div class="p-card-body">
          <div class="p-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <path d="M16 3.128a4 4 0 0 1 0 7.744"></path>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <circle cx="9" cy="7" r="4"></circle>
            </svg>
          </div>
          <div>
            <div class="p-num">03</div>
            <div class="p-label">User Testing</div>
          </div>
        </div>
      </div>

      <div class="p-arrow" style="--accent: #D4508A; --accent-glow: rgba(212,80,138,0.4); --line-op: 0.6; --head-op: 0.7; --i: 2;">
        <div class="p-arrow-line"></div>
        <svg class="p-arrow-head" width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 1.5L7.5 4.5L1 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div class="p-arrow-dot"></div>
      </div>

      <!-- 04 Iterations -->
      <div class="p-card" style="--accent: #D4508A; --accent-bg: #FDF0F5; --i: 3;">
        <div class="p-card-body">
          <div class="p-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="m11 10 3 3"></path>
              <path d="M6.5 21A3.5 3.5 0 1 0 3 17.5a2.62 2.62 0 0 1-.708 1.792A1 1 0 0 0 3 21z"></path>
              <path d="M9.969 17.031 21.378 5.624a1 1 0 0 0-3.002-3.002L6.967 14.031"></path>
            </svg>
          </div>
          <div>
            <div class="p-num">04</div>
            <div class="p-label">Iterations</div>
          </div>
        </div>
      </div>

    </div>

    <!-- loop arc -->
    <div class="p-loop">
      <svg viewBox="0 0 560 52" fill="none" preserveAspectRatio="none">
        <defs>
          <linearGradient id="p-arc-grad" x1="560" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#D4508A"></stop>
            <stop offset="0.5" stop-color="#9B6FD4"></stop>
            <stop offset="1" stop-color="#D4508A"></stop>
          </linearGradient>
        </defs>
        <path class="p-arc" d="M 540 6 C 540 46 20 46 20 6" stroke="url(#p-arc-grad)" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
        <path class="p-arc-head" d="M 20 6 L 14 13 M 20 6 L 27 13" stroke="#D4508A" stroke-width="1.6" stroke-linecap="round"></path>
      </svg>
      <div class="p-arc-dot"></div>
      <p class="p-caption">repeats until ready to ship</p>
    </div>

  </div>
</div>

<script>
var pStage = document.getElementById('process-stage');
var pFit = document.getElementById('process-fit');
var P_W = 1160;
function fitProcess() {
  if (!pStage || !pFit) return;
  var scale = Math.max(0.5, Math.min(1.4, pFit.clientWidth / P_W));
  pStage.style.transform = 'scale(' + scale + ')';
  pFit.style.height = (pStage.offsetHeight * scale) + 'px';
}
fitProcess();
window.addEventListener('resize', fitProcess);
</script>
</body>
</html>
